---
- name: Update Packages
  hosts: local
  connection: local
  roles:
    - role: check_os
      check_os_expected_system: Linux
    - apt
    - llm
    - go
    - haskell
    - youki
    - update
    - role: workspace
      vars:
        workspace_repos:
          - repo: https://github.com/kait-cronos/sdplane-dev.git
            dest: sdplane-dev
          - repo: https://github.com/kait-cronos/libsdplane-dev.git
            dest: libsdplane-dev
          - repo: https://github.com/yasuhironet/lthread.git
            dest: lthread
