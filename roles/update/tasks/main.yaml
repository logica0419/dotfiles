---
- name: Update Homebrew-related components
  block:
    - name: Update Homebrew & Homebrew packages
      community.general.homebrew:
        update_homebrew: true
        upgrade_all: true
    - name: Prune Homebrew cache
      ansible.builtin.shell: |
        set -e
        brew autoremove
        brew cleanup
      changed_when: false
    - name: Update Homebrew cask applications
      community.general.homebrew_cask:
        upgrade_all: true
      when: ansible_facts.system == "Darwin"

- name: Update tool packages
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      if command -v {{ item.check }} >/dev/null 2>&1; then
        {{ item.command }}
      fi
  changed_when: false
  loop:
    - command: gup update
      check: gup
    - command: rustup update
      check: rustup
    - command: kubectl-krew upgrade
      check: kubectl-krew
    - command: uv tool upgrade --all
      check: uv
    - command: mise upgrade --bump
      check: mise

- name: Update gh extensions
  block:
    - name: Get gh auth status
      ansible.builtin.command: gh auth status
      register: update_gh_auth
      changed_when: false
      failed_when: update_gh_auth.rc not in [0, 1]
    - name: Update gh extensions
      ansible.builtin.command: gh extension upgrade --all
      changed_when: false
      when: update_gh_auth.rc == 0

- name: Prune Docker components
  ansible.builtin.shell: |
    set -e
    if command -v docker >/dev/null 2>&1; then
      docker image prune -a -f
      docker volume prune -a -f
      docker network prune -f
    fi
  changed_when: false
