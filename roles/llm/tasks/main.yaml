---
- name: Install rtk
  community.general.homebrew:
    name: rtk
    state: present
- name: Configure rtk
  ansible.builtin.command: rtk init -g --copilot
  changed_when: false

- name: Deploy agent skills
  block:
    - name: Create agent skills directories
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - .agents
        - .agents/skills
        - .agents/skills/cleanup-merged-branch
        - .agents/skills/parallel-worktree
        - .agents/skills/git-commit-and-pr
        - .agents/skills/coderabbit-review-loop
        - .agents/skills/instruction-maintenance
    - name: Deploy agent skills files
      ansible.builtin.copy:
        src: "skills/{{ item }}/SKILL.md"
        dest: "{{ ansible_facts.user_dir }}/.agents/skills/{{ item }}/SKILL.md"
        mode: "0644"
      loop:
        - cleanup-merged-branch
        - parallel-worktree
        - git-commit-and-pr
        - coderabbit-review-loop
        - instruction-maintenance
    - name: Install explainer skills
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -eu -o pipefail
          if ! command -v bunx >/dev/null 2>&1; then
            echo "bunx not found" >&2
            exit 1
          fi
          bunx --bun skills add mizchi/explainer --skill '*' -g -a github-copilot -y
      changed_when: false

- name: Deploy Copilot instructions
  block:
    - name: Create Copilot instructions directories
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - .copilot
        - .copilot/instructions
    - name: Deploy Copilot instructions files
      ansible.builtin.copy:
        src: "instructions/{{ item }}"
        dest: "{{ ansible_facts.user_dir }}/.copilot/instructions/{{ item }}"
        mode: "0644"
      loop:
        - comment-style.instructions.md
        - minimal-diff.instructions.md
        - string-yaml-style.instructions.md
        - ansible-style.instructions.md
        - shell-style.instructions.md
        - instruction-style.instructions.md
        - code-structure.instructions.md
        - quote-style.instructions.md
        - typescript-style.instructions.md
        - git-safety.instructions.md
        - github-actions.instructions.md
