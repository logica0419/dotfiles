---
- name: Create SSH directory
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.ssh"
    state: directory
    mode: "0700"

- name: Provision SSH keys from Bitwarden
  block:
    - name: Get Bitwarden status
      ansible.builtin.command: bw status
      register: ssh_bw_status
      changed_when: false
      failed_when: false
      check_mode: false
    - name: Get SSH key statuses for import decision
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ ssh_keys }}"
      loop_control:
        label: "{{ item.path }}"
      register: ssh_import_keys_stat
    - name: Fail when Bitwarden is not logged in and keys are missing
      ansible.builtin.fail:
        msg: "Bitwarden is not logged in. Run 'bw login' and 'bw unlock --raw' then export BW_SESSION, or place SSH keys manually."
      when:
        - ssh_import_keys_stat.results | selectattr('stat.exists', 'equalto', false) | list | length > 0
        - ssh_bw_status.rc != 0 or (ssh_bw_status.stdout | from_json).status != "unlocked"
    - name: Sync Bitwarden vault
      when:
        - lookup('env', 'DOTFILES_SKIP_BITWARDEN') != "true"
        - ssh_bw_status.rc == 0 and (ssh_bw_status.stdout | from_json).status == "unlocked"
      ansible.builtin.command: bw sync
      register: ssh_bw_sync_result
      changed_when: false
    - name: Import SSH private keys from Bitwarden
      when:
        - lookup('env', 'DOTFILES_SKIP_BITWARDEN') != "true"
        - ssh_bw_status.rc == 0 and (ssh_bw_status.stdout | from_json).status == "unlocked"
        - ssh_bw_sync_result.rc == 0
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          umask 077
          if ! bw get item "{{ item.bitwarden_item }}" \
            | jq -r 'if .sshKey.privateKey != null and .sshKey.privateKey != "" then .sshKey.privateKey else .notes // "" end' \
            > "{{ item.path }}"; then
            rm -f "{{ item.path }}"
            exit 1
          fi
          chmod 600 "{{ item.path }}" || { rm -f "{{ item.path }}"; exit 1; }
          if ! ssh-keygen -y -f "{{ item.path }}" > /dev/null 2>&1; then
            rm -f "{{ item.path }}"
            exit 1
          fi
      loop: "{{ ssh_keys }}"
      loop_control:
        label: "{{ item.path }}"
      changed_when: true
      no_log: true

- name: Ensure SSH private key permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ ssh_keys }}"
  loop_control:
    label: "{{ item.path }}"
  failed_when: false

- name: Derive SSH public keys
  block:
    - name: Derive SSH public keys
      ansible.builtin.command: ssh-keygen -y -f "{{ item.path }}"
      loop: "{{ ssh_keys }}"
      loop_control:
        label: "{{ item.path }}"
      register: ssh_pubkey_derive_results
      changed_when: false
    - name: Deploy derived public keys
      ansible.builtin.copy:
        dest: "{{ item.item.path }}.pub"
        content: "{{ item.stdout }}\n"
        mode: "0644"
      loop: "{{ ssh_pubkey_derive_results.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.rc is defined and item.rc == 0
