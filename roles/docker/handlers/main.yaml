---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Restart Docker
  become: true
  ansible.builtin.service:
    name: docker
    state: restarted

- name: Reload Lima autostart agent
  community.general.launchd:
    name: io.lima-vm.autostart.docker
    enabled: true
    state: reloaded
