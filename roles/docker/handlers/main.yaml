---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Restart Docker
  become: true
  ansible.builtin.service:
    name: docker
    state: restarted

- name: Reload container launch daemon
  become: true
  community.general.launchd:
    name: homebrew.mxcl.container
    enabled: true
    state: reloaded

- name: Reload socktainer launch agent
  become: false
  community.general.launchd:
    name: homebrew.mxcl.socktainer
    enabled: true
    state: reloaded
