---
- name: Install containerization packages
  block:
    - name: Register Homebrew tap
      community.general.homebrew_tap:
        name: slp/krun
    - name: Trust Homebrew tap
      ansible.builtin.command: brew trust slp/krun
      changed_when: false
    - name: Install Homebrew packages
      community.general.homebrew:
        name:
          - lima
          - krunkit
        state: latest

- name: Deploy Lima instance
  block:
    - name: Check Lima instance
      ansible.builtin.command: limactl list docker --json
      register: docker_lima_instance
      failed_when: false
      changed_when: false
    - name: Create Lima instance
      ansible.builtin.command: limactl create --name docker --vm-type krunkit --mount-type virtiofs --cpus 10 --memory 12 --mount-writable template:docker
      when: docker_lima_instance.rc != 0
      changed_when: true
    - name: Start Lima instance
      ansible.builtin.command: limactl start docker
      changed_when: false
    - name: Enable Lima autostart
      ansible.builtin.command: limactl start-at-login docker
      changed_when: false

- name: Create Lima Docker context
  block:
    - name: Check Lima Docker context
      ansible.builtin.command: docker context inspect lima-docker
      register: docker_lima_docker_context
      failed_when: false
      changed_when: false
    - name: Create Lima Docker context
      ansible.builtin.command: docker context create lima-docker --docker host=unix://{{ ansible_facts.user_dir }}/.lima/docker/sock/docker.sock
      when: docker_lima_docker_context.rc != 0
      changed_when: true
