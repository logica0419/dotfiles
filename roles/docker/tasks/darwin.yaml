---
- name: Install containerization packages
  block:
    - name: Register Homebrew tap
      community.general.homebrew_tap:
        name: slp/krun
    - name: Trust Homebrew tap
      ansible.builtin.command: brew trust slp/krun
      changed_when: false
    - name: Install Homebrew packages
      community.general.homebrew:
        name:
          - lima
          - krunkit

- name: Deploy Lima instance
  block:
    - name: Check Lima instance
      ansible.builtin.command: limactl list default --json
      register: docker_lima_instance
      failed_when: false
      changed_when: false
    - name: Create Lima instance
      ansible.builtin.command: limactl create --name default --vm-type krunkit --mount-type virtiofs --cpus 10 --memory 12 template:docker
      when: docker_lima_instance.rc != 0
      changed_when: true
    - name: Start Lima instance
      ansible.builtin.command: limactl start default
      register: docker_lima_start
      failed_when: false
      changed_when: docker_lima_start.rc == 0
    - name: Enable Lima autostart
      ansible.builtin.command: limactl start-at-login default
      register: docker_lima_autostart
      failed_when: false
      changed_when: docker_lima_autostart.rc == 0

- name: Create Lima Docker context
  block:
    - name: Check Lima Docker context
      ansible.builtin.command: docker context inspect lima-default
      register: docker_lima_docker_context
      failed_when: false
      changed_when: false
    - name: Create Lima Docker context
      ansible.builtin.command: docker context create lima-default --docker host=unix://{{ ansible_facts.user_dir }}/.lima/default/sock/docker.sock
      when: docker_lima_docker_context.rc != 0
      changed_when: true
