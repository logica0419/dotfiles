---
- name: Enable linger mode
  ansible.builtin.command: loginctl enable-linger {{ ansible_user }}
  changed_when: false

- name: Install sdplane dependencies
  become: true
  ansible.builtin.apt:
    name:
      - build-essential
      - cmake
      - autotools-dev
      - autoconf
      - automake
      - libtool
      - pkg-config
      - etckeeper
      - tig
      - bridge-utils
      - iptables-persistent
      - fail2ban
      - dmidecode
      - screen
      - ripgrep
      - dpdk-dev
      - libdpdk-dev
      - liburcu-dev
      - libpcap-dev
    state: present
    update_cache: true
