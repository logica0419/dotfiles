name: Actions CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: actions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    env:
      GHALINT_VERSION: v1.6.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          fail_level: error
      - name: Cache ghalint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ghalint-cache
        with:
          path: ghalint
          key: ghalint-${{ env.GHALINT_VERSION }}
      - name: Install ghalint
        if: steps.ghalint-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GHALINT_VERSION" -R suzuki-shunsuke/ghalint \
            -p 'ghalint_*_linux_amd64.tar.gz' \
            -p 'ghalint_*_checksums.txt'
          sha256sum -c --ignore-missing ghalint_*_checksums.txt
          tar -xzf ghalint_*_linux_amd64.tar.gz ghalint
      - name: Run ghalint
        run: ./ghalint run
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
