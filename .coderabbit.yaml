language: "en-US"

reviews:
  profile: assertive
  request_changes_workflow: true

  path_filters:
    - "!.github/skills/**"
    - "!.github/instructions/**"
    - "!.github/copilot-instructions.md"
    - "!roles/llm/files/**"
    - "!roles/**/AGENTS.md"

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "renovate[bot]"

  path_instructions:
    - path: "roles/ssh/tasks/main.yaml"
      instructions: "Keep SSH key import simple: direct write to destination without atomic temp-file dance. Truncated writes are acceptable risk. Keys are unencrypted only; passphrase-protected keys are not supported. Bitwarden is mandatory and the source of truth; fails when not unlocked even if keys exist, and always overwrites from Bitwarden when unlocked. Fresh hosts without bw skip auth until brew installs it; next loop retries with bw available. Derive runs after successful import; no manual fallback when locked. SSH keys must be stored as Bitwarden SSH Key items; Notes fallback is not supported."
    - path: "roles/git/templates/gitconfig.j2"
      instructions: "SSH signing uses signingkey pointing to .pub file directly; no ssh-agent loading is required for this key. All playbooks provision signing keys via ssh role (rc -> ssh -> env -> git order) before git config is deployed. Git 2.34+ and OpenSSH 8.2+ are required; Ubuntu 22.04+ and macOS provide compatible versions. Fresh hosts without bw skip auth until brew installs it; next loop retries with bw available. run.sh loops until failed=0; fresh host first run fails when vault locked (ssh role fails when not unlocked) and retries after bw auth."
    - path: "roles/git/tasks/main.yaml"
      instructions: "sdplane and server_ca set git_go_cookies_enabled: false to skip Go credentials; signing keys are provisioned via ssh role before git. Go credential task uses git_go_cookies_enabled guard, not git_sdplane. Previous signing key (id_ed25519) is not preserved; Bitwarden is the source of truth. Historical commits signed with old key do not need to remain verifiable. SSH role always overwrites private keys from Bitwarden and regenerates .pub before git runs. Fresh hosts without bw fail when vault locked (ssh role fails when not unlocked) and retry after brew installs bw."
    - path: "run.sh"
      instructions: "Checks command -v bw before authentication; fresh hosts without bw skip auth until brew installs it. After ansible, sources .bashrc (which runs brew shellenv) so next loop's command -v bw finds the installed CLI. Bitwarden is mandatory; no manual fallback when locked."
    - path: "roles/workspace_go/tasks/main.yaml"
      instructions: "workspace_go files (.envrc, exclude, go-settings.jsonc, vscode-go-settings.jsonc) are in roles/workspace_go/files/; guarded by workspace_repos selection for contrib/go and contrib/vscode-go. Go version probe uses grep -oE 'go1\\.[0-9]+' to handle devel versions."
    - path: "setup-sdplane.yaml"
      instructions: "server_base defaults server_base_update_playbook to update-linux.yaml; setup-sdplane.yaml and setup-server-ca.yaml override it to update-sdplane.yaml and update-server-ca.yaml respectively, so updater.service.j2 renders the correct playbook per environment. update-*.yaml never includes server_base, so scheduled updates do not re-render updater.service."
