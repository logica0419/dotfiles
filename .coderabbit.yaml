language: "en-US"

reviews:
  profile: assertive
  request_changes_workflow: true

  path_filters:
    - "!.github/skills/**"
    - "!.github/instructions/**"
    - "!.github/copilot-instructions.md"
    - "!roles/llm/files/**"
    - "!roles/**/AGENTS.md"

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "renovate[bot]"

  path_instructions:
    - path: "roles/ssh/tasks/main.yaml"
      instructions: "Keep SSH key import simple: direct write to destination without atomic temp-file dance. Truncated writes are acceptable risk. Keys are unencrypted only; passphrase-protected keys are not supported. Bitwarden is the source of truth when unlocked; manually placed keys are used when Bitwarden is locked and keys already exist."
    - path: "import.sh"
      instructions: "Clone uses HTTPS (https://github.com/logica0419/dotfiles.git) and does not require SSH key authentication."
    - path: "roles/git/templates/gitconfig.j2"
      instructions: "SSH signing uses signingkey pointing to .pub file directly; no ssh-agent loading is required for this key. All playbooks provision signing keys via ssh role (rc -> ssh -> env -> git order) before git config is deployed."
    - path: "roles/git/tasks/main.yaml"
      instructions: "sdplane and server_ca set git_go_cookies_enabled: false to skip Go credentials; signing keys are provisioned via ssh role before git. Go credential task uses git_go_cookies_enabled guard, not git_sdplane."
    - path: "roles/git/defaults/main.yml"
      instructions: "SSH signing uses signingkey pointing to .pub file directly; ssh role derives .pub from private key before git runs, so no agent is needed. Keys are unencrypted only. Git signing requires the private key on disk; ssh-agent is not used."
