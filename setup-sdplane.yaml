---
- name: Run Playbook for sdplane Dev Environment
  hosts: local
  connection: local
  roles:
    - role: check_os
      check_os_expected_system: Linux
    - apt
    - brew
    - rc
    - ssh
    - role: server_base
      vars:
        server_base_update_playbook: update-sdplane.yaml
    - sdplane
    - llm
    - role: git
      git_go_cookies_enabled: false
    - role: workspace
      vars:
        workspace_repos:
          - repo: https://github.com/kait-cronos/sdplane-dev.git
            dest: sdplane-dev
          - repo: https://github.com/kait-cronos/libsdplane-dev.git
            dest: libsdplane-dev
          - repo: https://github.com/yasuhironet/lthread.git
            dest: lthread
    - completion
